# Testcontainers 설정
# 컨테이너 재사용 활성화 (Windows에서도 작동하도록 설정)
# 주의: Windows에서는 Docker Desktop이 실행 중이어야 합니다
testcontainers.reuse.enable=true

# Ryuk 컨테이너 비활성화 (성능 향상, 단 개발 환경에서만 사용)
# testcontainers.ryuk.container.image=testcontainers/ryuk:0.5.1

# 로그 레벨 조정 (선택사항)
# testcontainers.log.level=WARN

# Windows 환경에서의 호환성 설정
# Docker 소켓 경로 설정 (필요한 경우)
# testcontainers.docker.socket.override=/var/run/docker.sock

# 컨테이너 정리 전략
# testcontainers.checks.disable=true  # 체크 비활성화 (개발 환경에서만)

