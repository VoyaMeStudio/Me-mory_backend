version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: memory-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: memory_db
      MYSQL_USER: memory_user
      MYSQL_PASSWORD: memory_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  app-blue:
    image: choehyungwon/memory-app:latest
    container_name: memory-app-blue
    env_file:
      - .env
    ports:
      - "8081:8080"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/memory_db?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: memory_user
      SPRING_DATASOURCE_PASSWORD: memory_password
    restart: unless-stopped
    profiles: [ "blue" ]

  app-green:
    image: choehyungwon/memory-app:latest
    container_name: memory-app-green
    env_file:
      - .env
    ports:
      - "8082:8080"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/memory_db?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: memory_user
      SPRING_DATASOURCE_PASSWORD: memory_password
    restart: unless-stopped
    profiles: [ "green" ]

  nginx:
    image: nginx:alpine
    container_name: memory-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      app-blue:
        condition: service_started
      app-green:
        condition: service_started
    restart: unless-stopped
    profiles: [ "blue", "green" ]

volumes:
  mysql_data:
