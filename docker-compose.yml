version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: memory-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: memory_db
      MYSQL_USER: memory_user
      MYSQL_PASSWORD: memory_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  app:
    image: choehyungwon/memory-app:latest
    container_name: memory-app
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "8081:8081"  # 외부는 8081, 내부는 8081
    restart: unless-stopped

  nginx:
    image: nginx:latest
    container_name: memory-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - app
    restart: unless-stopped

volumes:
  mysql_data:
