services:
  mysql:
    image: mysql:8.0
    container_name: memory-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: memory_db
      MYSQL_USER: memory_user
      MYSQL_PASSWORD: memory_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: choehyungwon/memory-app:latest
    container_name: memory-app
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/memory_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: memory_user
      SPRING_DATASOURCE_PASSWORD: memory_password
    ports:
      - "8081:8081"
    restart: unless-stopped

volumes:
  mysql_data:
